<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow: hidden; /* Para los corazones flotantes */
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }
        .font-dancing { font-family: 'Dancing Script', cursive; }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(255, 100, 150, 0.2);
        }

        /* Corazones flotantes */
        .heart {
            position: absolute;
            bottom: -100px;
            font-size: 24px;
            color: rgba(255, 75, 114, 0.6);
            animation: floatUp 10s linear infinite;
            z-index: -1;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5) rotate(360deg); opacity: 0; }
        }

        .fade-in { animation: fadeIn 0.5s ease-in forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .hidden-screen { display: none !important; }
        
        .option-btn { transition: all 0.3s ease; }
        .option-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,100,150,0.3); }
        .correct { background-color: #d1fae5 !important; border-color: #10b981 !important; color: #065f46 !important; }
        .incorrect { background-color: #ffe4e6 !important; border-color: #f43f5e !important; color: #9f1239 !important; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Contenedor de corazones -->
    <div id="hearts-container"></div>

    <!-- PANTALLA DE INICIO -->
    <div id="start-screen" class="glass-card rounded-3xl p-8 max-w-md w-full text-center fade-in z-10">
        <h1 class="font-dancing text-5xl text-rose-600 mb-4">Hola mi amor ❤️</h1>
        <p class="text-gray-700 mb-6 text-lg">He preparado este pequeño juego para ver qué tanto me conoces y recordar cositas nuestras.</p>
        <input type="text" id="name-input" placeholder="Escribe tu nombre hermoso aquí" class="w-full px-4 py-3 rounded-xl border-2 border-pink-200 focus:outline-none focus:border-rose-400 text-center mb-6 bg-white/60">
        <button onclick="startQuiz()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-6 rounded-xl transition-colors shadow-lg text-lg">
            ¡Empezar a jugar! 🥰
        </button>
    </div>

    <!-- PANTALLA DEL QUIZ -->
    <div id="quiz-screen" class="glass-card rounded-3xl p-6 md:p-8 max-w-xl w-full hidden-screen z-10">
        <div class="flex justify-between items-center mb-6">
            <span id="progress-text" class="text-rose-600 font-semibold">Pregunta 1 de 10</span>
            <span class="bg-rose-100 text-rose-600 py-1 px-3 rounded-full text-sm font-bold shadow-sm">Puntos: <span id="score">0</span></span>
        </div>
        
        <div class="mb-8 min-h-[80px] flex items-center">
            <h2 id="question-text" class="text-xl md:text-2xl text-gray-800 font-semibold leading-relaxed"></h2>
        </div>

        <div id="options-container" class="space-y-3">
            <!-- Opciones generadas por JS -->
        </div>

        <div id="feedback" class="mt-6 text-center min-h-[60px]"></div>

        <button id="next-btn" onclick="nextQuestion()" class="w-full mt-4 bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-6 rounded-xl transition-colors shadow-lg hidden">
            Siguiente pregunta 💖
        </button>
    </div>

    <!-- PANTALLA DE RESULTADOS -->
    <div id="result-screen" class="glass-card rounded-3xl p-8 max-w-xl w-full text-center hidden-screen z-10">
        <!-- El mensaje gigante irá aquí -->
        <div id="final-message-container" class="mb-6"></div>
        
        <p class="text-gray-700 mb-2 text-lg">Tu puntaje final es:</p>
        <p class="text-4xl font-bold text-rose-600 mb-6"><span id="final-score"></span> / 10</p>
        
        <p id="result-message" class="text-gray-800 text-lg mb-8 italic"></p>
        
        <button onclick="location.reload()" class="bg-white text-rose-500 border-2 border-rose-400 hover:bg-rose-50 font-bold py-2 px-6 rounded-xl transition-colors">
            Volver a jugar 🔄
        </button>
    </div>

    <script>
        // Preguntas configuradas con tus respuestas exactas
        const questions = [
            {
                q: "1. ¿Cuál es el primer nombre de nuestra futura hija?",
                options: ["Selin", "josline", "talyncito", "barci", "Joslyn"],
                ans: 4
            },
            {
                q: "2. ¿Dónde fue nuestra primera cita o nuestra primera salida especial?",
                options: ["Fuimos al cine a ver una película.", "Fuimos a comer algo rico y conversar.", "Caminando por un parque o plaza.", "Nos vimos en una fiesta o reunión de amigos."],
                ans: 2
            },
            {
                q: "3. ¿Quién de los dos fue el primero en decir 'Te amo'?",
                options: ["Yo primero, me ganaron las ganas y el sentimiento.", "Tú primero, fuiste más valiente.", "Lo dijimos casi al mismo tiempo, fue mágico.", "Se dio poco a poco y sin darnos cuenta ya nos amábamos."],
                ans: 0
            },
            {
                q: "4. ¿Qué es lo que más me encanta de ti físicamente?",
                options: ["Tus labios", "Tus ojos hermosos y tu mirada.", "Tu cabello y tu carita preciosa.", "Tu figura y tu forma de caminar."],
                ans: 0
            },
            {
                q: "5. ¿Cuál es el destino de viaje que más sueño con hacer a tu lado?",
                options: ["Ir a una playa hermosa, tomar el sol y relajarnos.", "Conocer la nieve o ir a un lugar con clima súper frío y acurrucarnos.", "Viajar a otro país y recorrer ciudades famosas juntos.", "Una aventura en la selva, campo o naturaleza."],
                ans: 2
            },
            {
                q: "6. ¿Cuál es mi reacción típica cuando me enojo o me frustro por alguna tontería?",
                options: ["Me quedo callado/a un rato hasta que se me pase solito.", "Empiezo a renegar o quejarme en voz alta.", "Me da ganas de comer algo rico para calmarme.", "Busco abrazarte porque tú eres mi lugar seguro y me calmas."],
                ans: 3
            },
            {
                q: "7. Si nos vamos a vivir juntos a nuestra propia casita, ¿qué es lo primero que yo compraría sin dudarlo?",
                options: ["Una tele enorme para ver nuestras series/películas.", "Una cama gigante y súper cómoda.", "Cosas para la cocina y mucha comida rica.", "Decoraciones y cositas para que se vea súper bonito."],
                ans: 3
            },
            {
                q: "8. ¿Qué detalle sencillo es el que me hace más feliz en un día normal?",
                options: ["Que me traigas o me invites mi dulce/postre favorito de sorpresa.", "Un mensajito largo y bonito de la nada mientras no estamos juntos.", "Que me invites a comer mi plato preferido.", "Llenarme de besos y abrazos apenas nos vemos."],
                ans: 3
            },
            {
                q: "9. Si tuviéramos que adoptar a un integrante más (una mascota) ahora mismo, ¿qué preferiría yo?",
                options: ["Un perrito súper juguetón y cariñoso.", "Un gatito tranquilo y mimoso.", "Un ave, hámster o mascota pequeñita.", "Mejor ninguna mascota por ahora, solo nosotros."],
                ans: 0
            },
            {
                q: "10. ¿Cómo me imagino nuestro futuro juntos de aquí a unos años?",
                options: ["Viviendo juntos en nuestra casita, súper felices.", "Viajando y disfrutando la vida juntos.", "Teniendo mucho éxito profesional.", "Casados y felices."],
                ans: 3
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let userName = "";
        let answered = false;

        // Crear corazones flotantes
        function createHearts() {
            const container = document.getElementById('hearts-container');
            for(let i=0; i<15; i++) {
                let heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.className = 'heart';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 5 + 8) + 's';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                container.appendChild(heart);
            }
        }
        createHearts();

        function startQuiz() {
            const input = document.getElementById('name-input').value.trim();
            if (input === "") {
                alert("Por favor, pon tu nombrecito mi amor ❤️");
                return;
            }
            userName = input;
            
            document.getElementById('start-screen').classList.add('hidden-screen');
            document.getElementById('quiz-screen').classList.remove('hidden-screen');
            document.getElementById('quiz-screen').classList.add('fade-in');
            
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            const q = questions[currentQuestion];
            document.getElementById('progress-text').innerText = `Pregunta ${currentQuestion + 1} de ${questions.length}`;
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('feedback').innerHTML = "";
            document.getElementById('next-btn').classList.add('hidden');

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = "";

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left bg-white/70 border-2 border-pink-100 hover:border-rose-300 text-gray-700 py-3 px-5 rounded-xl text-md md:text-lg flex items-center justify-between";
                btn.innerHTML = `
                    <span>${opt}</span>
                    <span class="icon w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center flex-shrink-0 ml-3"></span>
                `;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(index, selectedBtn) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const isCorrect = (index === q.ans);
            const allButtons = document.querySelectorAll('.option-btn');

            allButtons.forEach((btn, i) => {
                btn.disabled = true;
                btn.classList.remove('hover:border-rose-300', 'bg-white/70');
                const icon = btn.querySelector('.icon');

                if (i === q.ans) {
                    btn.classList.add('correct');
                    icon.innerHTML = '✓';
                    icon.classList.add('border-green-600', 'bg-green-100');
                    icon.classList.remove('border-gray-300');
                } else if (i === index && !isCorrect) {
                    btn.classList.add('incorrect');
                    icon.innerHTML = '✗';
                    icon.classList.add('border-red-600', 'bg-red-100');
                    icon.classList.remove('border-gray-300');
                } else {
                    btn.classList.add('opacity-50');
                }
            });

            const feedback = document.getElementById('feedback');
            if (isCorrect) {
                score++;
                document.getElementById('score').innerText = score;
                feedback.innerHTML = `<p class="text-green-600 font-bold text-lg animate-pulse">¡Correcto mi amor! 🥰</p>`;
            } else {
                feedback.innerHTML = `<p class="text-rose-600 font-bold text-lg">Ups... era la otra opción amor 🥺</p>`;
            }

            // EXCEPCIÓN: MENSAJE ESPECIAL PARA LA PREGUNTA 4 (índice 3)
            if (currentQuestion === 3) {
                feedback.innerHTML += `<div class="mt-3 p-4 bg-pink-100/90 border-2 border-pink-300 text-rose-600 rounded-xl font-bold shadow-md animate-bounce">
                    ✨ ¡Pero la verdad es que todo me encanta de ti, eres perfecta para mí! ✨
                </div>`;
            }

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                const quizScreen = document.getElementById('quiz-screen');
                quizScreen.classList.remove('fade-in');
                void quizScreen.offsetWidth; // Trigger reflow
                quizScreen.classList.add('fade-in');
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden-screen');
            const resultScreen = document.getElementById('result-screen');
            resultScreen.classList.remove('hidden-screen');
            resultScreen.classList.add('fade-in');

            document.getElementById('final-score').innerText = score;
            
            // EL GRAN MENSAJE FINAL
            document.getElementById('final-message-container').innerHTML = `
                <h1 class="font-dancing text-5xl md:text-6xl text-rose-600 mb-2 leading-tight">
                    ${userName}, quiero todo contigo mi amor
                </h1>
            `;

            let msg = "";
            if (score === 10) {
                msg = "¡10 de 10! Me conoces a la perfección, somos el uno para el otro. Te amo demasiado. ❤️";
            } else if (score >= 7) {
                msg = "¡Casi perfecto! Conoces muy bien mi corazón. Gracias por cada momento juntos. Te amo muchísimo. 💕";
            } else {
                msg = "Aún tenemos toda una vida juntos para seguir conociéndonos y amándonos cada día más. Te amo con todo mi corazón. 💖";
            }
            document.getElementById('result-message').innerText = msg;
        }
    </script>
</body>
</html>
